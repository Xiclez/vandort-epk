<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />

<link
  rel="preload"
  as="image"
  href="/images/vandort/hero-portrait2.webp"
  type="image/webp"
  fetchpriority="high"
/>

<link
  rel="preload"
  as="image"
  href="/images/vandort/vandort-logo.svg"
  type="image/svg+xml"
/>

<!-- Title/description are updated at runtime by the language context (see LanguageContext.tsx) -->
  <!-- Primary metadata -->
  <title>VANDORT — DJ, Selector & Artist</title>

  <meta
    name="description"
    content="Sitio oficial de VANDORT. DJ, selector y artista de darkwave, post-punk, electrónica alternativa, techno y open format."
  />

  <meta
    name="author"
    content="VANDORT"
  />

  <meta
    name="robots"
    content="index, follow, max-image-preview:large"
  />

  <link
    rel="canonical"
    href="https://dj-vandort.com/"
  />

  <!-- Open Graph: WhatsApp, Messenger, Facebook, LinkedIn, Discord -->
  <meta
    property="og:type"
    content="website"
  />

  <meta
    property="og:url"
    content="https://dj-vandort.com/"
  />

  <meta
    property="og:site_name"
    content="VANDORT"
  />

  <meta
    property="og:title"
    content="VANDORT — DJ, Selector & Artist"
  />

  <meta
    property="og:description"
    content="Atmósferas oscuras, emoción y energía para noches inolvidables. Explora sesiones, experiencias, galería, rider técnico y booking."
  />

  <meta
    property="og:image"
    content="https://dj-vandort.com/images/vandort/vandort-social-preview.jpg"
  />

  <meta
    property="og:image:secure_url"
    content="https://dj-vandort.com/images/vandort/vandort-social-preview.jpg"
  />

  <meta
    property="og:image:type"
    content="image/jpeg"
  />

  <meta
    property="og:image:width"
    content="1200"
  />

  <meta
    property="og:image:height"
    content="630"
  />

  <meta
    property="og:image:alt"
    content="VANDORT — DJ, Selector & Artist"
  />

  <meta
    property="og:locale"
    content="es_MX"
  />

  <meta
    property="og:locale:alternate"
    content="en_US"
  />

  <!-- X / Twitter Card -->
  <meta
    name="twitter:card"
    content="summary_large_image"
  />

  <meta
    name="twitter:title"
    content="VANDORT — DJ, Selector & Artist"
  />

  <meta
    name="twitter:description"
    content="Darkwave, post-punk, electrónica alternativa, techno y open format. Sesiones, experiencias, rider técnico y booking."
  />

  <meta
    name="twitter:image"
    content="https://dj-vandort.com/images/vandort/vandort-social-preview.jpg"
  />

  <meta
    name="twitter:image:alt"
    content="VANDORT — DJ, Selector & Artist"
  />

  <!-- Browser and mobile identity -->
  <meta
    name="theme-color"
    content="#050505"
  />

  <meta
    name="application-name"
    content="VANDORT"
  />

  <meta
    name="apple-mobile-web-app-title"
    content="VANDORT"
  />

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  />

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  />

  <!-- Favicons -->
  <link
    rel="icon"
    href="/favicon.ico"
    sizes="any"
  />

  <link
    rel="icon"
    type="image/png"
    sizes="32x32"
    href="/favicon-32x32.png"
  />

  <link
    rel="icon"
    type="image/png"
    sizes="16x16"
    href="/favicon-16x16.png"
  />

  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="/apple-touch-icon.png"
  />

</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
