<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />

<link
  rel="preload"
  as="image"
  href="/images/vandort/hero-portrait2.webp"
  type="image/webp"
  fetchpriority="high"
/>

<link
  rel="preload"
  as="image"
  href="/images/vandort/vandort-logo.svg"
  type="image/svg+xml"
/>

<!-- Title/description are updated at runtime by the language context (see LanguageContext.tsx) -->
<title>VANDORT — Press Kit Oficial</title>
    <meta
      name="description"
      content="Press kit oficial de VANDORT, DJ y selector de darkwave, post-punk, electrónica, techno y open format."
    />
    <!-- Open Graph placeholders — no OG image is generated at this stage -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="VANDORT — Press Kit Oficial" />
    <meta
      property="og:description"
      content="Press kit oficial de VANDORT, DJ y selector de darkwave, post-punk, electrónica, techno y open format."
    />
    <!-- <meta property="og:image" content="REPLACE_WITH_OG_IMAGE" /> -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
